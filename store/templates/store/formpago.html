{% extends 'base.html' %}
{% load static %}


{% block content %}

    <div>
        <h1 class="text-black">Formulario de datos de Pago</h1>
        <form action="">
          <div class="form-group">
            <label for="" class="form-label text-black">Banco de destino</label>
            <select class="form-control" name="" id="">
              <option>Banesco - 0134</option>
              <option>Venezuela - 0102</option>
              <option>Bancamiga - 0128</option>
            </select>
          </div>
            <div class="form-group">
              <label for="" class="form-label text-black">Banco de origen</label>
              <select class="form-control" name="" id="">
                <option>Banesco - 0134</option>
                <option>Venezuela - 0102</option>
                <option>Bancamiga - 0128</option>
              </select>
            </div>
            <div class="form-group">
              <label for="" class="form-label text-black">N° de referencia</label>
              <input type="text" name="" id="" class="form-control" placeholder="" aria-describedby="helpId">
            </div>
            <div class="form-group">
              <label for="" class="form-label text-black">Monto</label>
              <input type="text" name="" id="" readonly class="form-control" placeholder="" aria-describedby="helpId">
            </div>
            <div class="form-group mt-2">
              <label for="" class="form-label text-black">Comprobantes de pago</label>
              <input type="file" class="form-control-file" name="" id="" placeholder="" aria-describedby="fileHelpId">
            </div>
            <button type="submit" class="btn btn-primary mt-2">Guardar</button>
        </form>
        
    </div>
    
{% endblock content %}
