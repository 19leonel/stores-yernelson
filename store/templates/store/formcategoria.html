{% extends 'base.html' %}
{% load static %}


{% block content %}
<h1 class="text-black">Formulario de Categorías</h1>
<form action="">
    <div class="form-group ">
        <label for="" class="form-label text-black">Categoria</label>
        <input type="text" name="" id="" class="form-control " placeholder="Categoria" aria-describedby="helpId">
    </div>
    <div class="form-group">
        <label for="" class="form-label text-black">Descripción</label>
        <input type="text" name="" id="" class="form-control" placeholder="Descripción" aria-describedby="helpId">
    </div>
    <button type="submit" class="btn btn-primary mt-2">Guardar</button>
</form>
<div class="table-responsive mt-5 mb-5">
    <table class="table">
        <thead class="thead-dark">
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Categoria</th>
                <th scope="col">Descripción</th>
            </tr>
        </thead>
        <tbody>
            <tr class="">
                <td scope="row">1</td>
                <td>Piso</td>
                <td>Material para pisos</td>
            </tr>
            <tr class="">
                <td scope="row">2</td>
                <td>pared</td>
                <td>Material para paredes</td>
            </tr>
        </tbody>
    </table>
</div>


{% endblock content %}
