{% extends 'base.html' %}
{% load static %}

{% block content %}

    <div class="Form-Producto">

        <h1 class="text-black">Formulario de Productos</h1>
        <form action="">
            <div class="form-group ">
                <label for="" class="form-label text-black">Nombre</label>
                <input type="text" name="" id="" class="form-control " placeholder="Nombre" aria-describedby="helpId">
            </div>
            <div class="form-group">
                <label for="" class="form-label text-black">Descripción</label>
                <input type="text" name="" id="" class="form-control" placeholder="Descripción" aria-describedby="helpId">
            </div>
            <div class="form-group">
                <label for="" class="form-label text-black">Categoría</label>
                <input type="text" name="" id="" class="form-control" placeholder="Categoría" aria-describedby="helpId">
            </div>
            <div class="form-group">
                <label for="" class="form-label text-black">Palabras Clave</label>
                <input type="text" name="" id="" class="form-control" placeholder="Palabras Clave" aria-describedby="helpId">
            </div>
            <div class="form-group">
                <label for="" class="form-label text-black">Precio</label>
                <input type="text" name="" id="" class="form-control" placeholder="Precio" aria-describedby="helpId">
            </div>
            <button type="submit" class="btn btn-primary mt-2">Guardar</button>
        </form>

    </div>

{% endblock content %}
